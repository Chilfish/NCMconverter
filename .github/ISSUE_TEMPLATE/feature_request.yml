name: 功能请求
description: 建议一个新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在什么场景下遇到了不便，现在的行为为什么不够用。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案
      description: 如果你已经有想法，写在这里；没有也可以先只提问题。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

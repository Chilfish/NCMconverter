name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install make
        # The Linux and macOS images ship make; the Windows image does not.
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress
      - name: Check formatting
        # gofmt is the same everywhere, so one platform is enough, and the
        # check is a POSIX shell idiom.
        if: runner.os == 'Linux'
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test
        run: make test-race
      - name: Build
        run: make build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test with coverage
        run: make coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The action pins and installs golangci-lint itself, so this job does not
      # go through the make target.
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so a new release cannot turn a green build red on its own.
          # Bump it together with the local golangci-lint.
          version: v2.14.0

# GoReleaser configuration. See https://goreleaser.com for the reference.
version: 2

project_name: ncmconverter

builds:
  - id: ncmconverter
    main: ./cmd/ncmconverter
    binary: ncmconverter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: ncmconverter
    # Windows gets a zip, because its users expect one; everything else gets a
    # tarball.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

# deb and rpm packages for the Linux targets. Windows and macOS get the plain
# archives above.
nfpms:
  - id: ncmconverter
    package_name: ncmconverter
    vendor: Chilfish
    homepage: https://github.com/chilfish/ncmconverter
    maintainer: Chilfish <chill4fish@gmail.com>
    description: |-
      Convert NetEase Cloud Music (.ncm) files into mp3 or flac, keeping the
      metadata, cover art and lyrics.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/ncmconverter/LICENSE
      - src: README.md
        dst: /usr/share/doc/ncmconverter/README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  # The curated, user-facing notes live in CHANGELOG.md. The body below is the
  # commit list, grouped by conventional-commit type, with a link back to it.
  footer: |
    ---

    完整的变更记录见 [CHANGELOG.md](https://github.com/Chilfish/NCMconverter/blob/main/CHANGELOG.md)。

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Others
      regexp: '^.*$'
      order: 2
  filters:
    exclude:
      # Match the bare type, so a scoped subject such as chore(release): or
      # build(deps): is excluded too. Release plumbing and the pre-release
      # rewrite are not user-facing changes.
      - "^chore"
      - "^ci"
      - "^docs"
      - "^test"
      - "^build"
      - "^refactor"
      - "^Initial commit"
      # Any release plumbing, whatever its type.
      - "\\(release\\)"
